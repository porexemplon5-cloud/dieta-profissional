<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Dieta</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1ea; --ink:#1a1a1a; --muted:#7a7468; --line:#d9d3c4;
    --card:#fffdf7; --accent:#c2410c;
    --ok:#16a34a; --low:#ea580c; --high:#dc2626;
  }
  *{box-sizing:border-box}
  body{font-family:'Fraunces',serif;background:var(--bg);color:var(--ink);margin:0;padding:14px;max-width:720px;margin-inline:auto}
  h1{font-size:1.4rem;font-weight:800;letter-spacing:-0.02em;margin:0 0 4px}
  .sub{font-size:.78rem;color:var(--muted);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;margin-bottom:18px}

  .resumo{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:50;border-bottom:1px solid var(--line)}
  .r-card{background:var(--card);padding:10px 12px;border-radius:10px;border:1px solid var(--line)}
  .r-label{font-family:'JetBrains Mono',monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
  .r-value{font-size:1.1rem;font-weight:800;margin-top:2px;font-feature-settings:"tnum"}
  .r-meta{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--muted);font-weight:400;display:block;margin-top:1px}
  .ok{color:var(--ok)}.low{color:var(--low)}.high{color:var(--high)}

  .tabs{display:flex;gap:4px;margin:14px 0 10px;background:var(--card);padding:4px;border-radius:10px;border:1px solid var(--line)}
  .tab{flex:1;padding:8px;border:none;background:transparent;font-family:'JetBrains Mono',monospace;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);cursor:pointer;border-radius:7px;font-weight:600}
  .tab.active{background:var(--ink);color:var(--bg)}

  .ref-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .ref-head{border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:10px}
  .ref-title{font-size:1.1rem;font-weight:600;margin:0}
  .macros-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:600}

  .item{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 28px 9px 10px;margin-bottom:6px;position:relative}
  .item-name{font-weight:600;font-size:.88rem;display:block;margin-bottom:3px}
  .item-peso{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);font-weight:400}
  .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
  .tag{font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:2px 5px;border-radius:3px;background:#f4f1ea;color:var(--muted);font-weight:600}
  .btn-del{position:absolute;top:6px;right:6px;background:none;border:none;color:#ccc;font-size:.95rem;cursor:pointer;padding:4px}
  .btn-del:hover{color:var(--high)}

  .add-area{display:grid;grid-template-columns:1fr 90px 40px;gap:5px;margin-top:10px}
  select,input{padding:9px 8px;border-radius:7px;border:1px solid var(--line);font-size:.85rem;background:#fff;font-family:'Fraunces',serif;color:var(--ink)}
  input[type=number]{font-family:'JetBrains Mono',monospace}
  .btn-add{background:var(--ink);color:var(--bg);border:none;border-radius:7px;font-weight:700;cursor:pointer;font-size:1rem}
  .btn-add:hover{background:var(--accent)}

  .cadastro{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .cad-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .cad-form .full{grid-column:span 2}
  .cad-form label{font-family:'JetBrains Mono',monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block;margin-bottom:3px}
  .cad-form input,.cad-form select{width:100%}
  .btn-primary{background:var(--accent);color:#fff;border:none;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;width:100%;font-family:'JetBrains Mono',monospace;text-transform:uppercase;font-size:.78rem;letter-spacing:.08em}
  .btn-primary:hover{background:var(--ink)}

  .tipo-toggle{display:flex;gap:6px;grid-column:span 2;margin-bottom:4px}
  .tipo-btn{flex:1;padding:8px;border:1px solid var(--line);background:#fff;border-radius:7px;font-family:'JetBrains Mono',monospace;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;font-weight:600;color:var(--muted)}
  .tipo-btn.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}

  .unidade-fields{display:none;grid-column:span 2;grid-template-columns:1fr 1fr;gap:8px}
  .unidade-fields.active{display:grid}

  .lista-alim{margin-top:14px;max-height:340px;overflow-y:auto}
  .lista-categoria{font-family:'JetBrains Mono',monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:8px 0 4px;border-bottom:1px solid var(--line);margin-top:6px}
  .alim-row{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px dashed var(--line);font-size:.82rem;gap:6px}
  .alim-row:last-child{border-bottom:none}
  .alim-info{flex:1;min-width:0}
  .alim-info strong{display:block;font-weight:600;font-size:.82rem}
  .alim-info small{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--muted)}
  .alim-info .badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.58rem;padding:1px 4px;border-radius:3px;background:#e8e2d0;color:var(--muted);font-weight:600;margin-left:4px;text-transform:uppercase;letter-spacing:.05em}
  .alim-row button{background:none;border:1px solid var(--line);padding:3px 6px;border-radius:5px;font-size:.65rem;cursor:pointer;font-family:'JetBrains Mono',monospace;flex-shrink:0}
  .alim-row .edit-btn:hover{background:var(--ink);color:var(--bg)}
  .alim-row .del-btn:hover{background:var(--high);color:#fff;border-color:var(--high)}

  .metas-form{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
  .metas-form .label-full{grid-column:span 3;font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);text-transform:uppercase;margin-top:6px}
  .metas-form input{width:100%;padding:7px;font-size:.8rem}
  .metas-form .sep{align-self:center;text-align:center;color:var(--muted)}

  .footer-actions{display:flex;gap:6px;margin-top:14px}
  .footer-actions button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-family:'JetBrains Mono',monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;font-weight:600}
  .footer-actions button:hover{background:var(--ink);color:var(--bg)}

  .hidden{display:none}
  .empty{font-size:.8rem;color:var(--muted);font-style:italic;text-align:center;padding:14px 0}

  .reset-warning{background:#fef3c7;border:1px solid #fbbf24;color:#78350f;padding:10px;border-radius:8px;font-size:.78rem;margin-bottom:12px}
  .reset-warning button{margin-top:6px;padding:6px 12px;background:#78350f;color:#fff;border:none;border-radius:5px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.7rem;text-transform:uppercase}

  @media print{
    .no-print{display:none!important}
    .resumo{position:static!important;page-break-inside:avoid}
    .ref-card{break-inside:avoid;page-break-inside:avoid}
    body{background:#fff;padding:8px}
    .tab-content.hidden{display:none}
    #tab-diario{display:block!important}
  }
</style>
</head>
<body>

<h1>Calculadora de Dieta</h1>
<div class="sub">TACO + Rótulos · Peso ou Unidade</div>

<div id="erro-area"></div>

<div class="resumo" id="resumo"></div>

<div class="tabs no-print">
  <button class="tab active" data-tab="diario">Diário</button>
  <button class="tab" data-tab="alimentos">Alimentos</button>
  <button class="tab" data-tab="metas">Metas</button>
</div>

<div id="tab-diario" class="tab-content">
  <div id="refeicoes"></div>
  <div class="footer-actions no-print">
    <button onclick="window.print()">Salvar PDF</button>
    <button onclick="limparDia()">Limpar Dia</button>
  </div>
</div>

<div id="tab-alimentos" class="tab-content hidden">
  <div class="cadastro">
    <div style="font-family:'JetBrains Mono',monospace;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">Cadastrar Alimento</div>
    <div class="cad-form">
      <div class="tipo-toggle">
        <button type="button" class="tipo-btn active" data-tipo="peso" onclick="toggleTipo('peso')">Por 100g</button>
        <button type="button" class="tipo-btn" data-tipo="unidade" onclick="toggleTipo('unidade')">Por Unidade</button>
      </div>
      <div class="full"><label>Nome</label><input id="cad-nome" type="text" placeholder="ex: Arroz cozido"></div>
      <div class="unidade-fields" id="unidade-fields-block">
        <div><label>Tamanho da unidade</label><input id="cad-tamanho" type="number" step="0.1" placeholder="ex: 170"></div>
        <div><label>Unidade de medida</label><select id="cad-medida"><option value="g">gramas (g)</option><option value="ml">mililitros (ml)</option></select></div>
      </div>
      <div id="label-base" class="full" style="font-family:'JetBrains Mono',monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-top:4px">Valores por 100g</div>
      <div><label>Calorias (kcal)</label><input id="cad-kcal" type="number" step="0.1" placeholder="0"></div>
      <div><label>Carboidrato (g)</label><input id="cad-carb" type="number" step="0.1" placeholder="0"></div>
      <div><label>Proteína (g)</label><input id="cad-prot" type="number" step="0.1" placeholder="0"></div>
      <div><label>Gordura (g)</label><input id="cad-gord" type="number" step="0.1" placeholder="0"></div>
      <div class="full"><label>Fibra (g)</label><input id="cad-fibra" type="number" step="0.1" placeholder="0"></div>
    </div>
    <button class="btn-primary" onclick="salvarAlimento()">Salvar Alimento</button>
    <button class="btn-primary" onclick="cancelarEdicao()" style="background:#999;margin-top:6px;display:none" id="btn-cancelar">Cancelar Edição</button>
    <input type="hidden" id="cad-editing" value="">
    <input type="hidden" id="cad-tipo" value="peso">
    <div class="lista-alim" id="lista-alim"></div>
  </div>
</div>

<div id="tab-metas" class="tab-content hidden">
  <div class="cadastro">
    <div style="font-family:'JetBrains Mono',monospace;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">Metas Diárias (faixas mín–máx)</div>
    <div class="metas-form">
      <div class="label-full">Calorias</div>
      <input id="meta-kcal-min" type="number" placeholder="mín"><span class="sep">–</span><input id="meta-kcal-max" type="number" placeholder="máx">
      <div class="label-full">Carboidrato (g)</div>
      <input id="meta-carb-min" type="number" placeholder="mín"><span class="sep">–</span><input id="meta-carb-max" type="number" placeholder="máx">
      <div class="label-full">Proteína (g)</div>
      <input id="meta-prot-min" type="number" placeholder="mín"><span class="sep">–</span><input id="meta-prot-max" type="number" placeholder="máx">
      <div class="label-full">Gordura (g)</div>
      <input id="meta-gord-min" type="number" placeholder="mín"><span class="sep">–</span><input id="meta-gord-max" type="number" placeholder="máx">
      <div class="label-full">Fibra (g)</div>
      <input id="meta-fibra-min" type="number" placeholder="mín"><span class="sep">–</span><input id="meta-fibra-max" type="number" placeholder="máx">
    </div>
    <button class="btn-primary" onclick="salvarMetas()" style="margin-top:10px">Salvar Metas</button>
    <button class="btn-primary" onclick="resetarTudo()" style="background:#999;margin-top:8px">Resetar Tudo (apaga dados)</button>
  </div>
</div>

<script>
// Handler global de erros - mostra qualquer erro de JS na tela
window.addEventListener('error', function(e){
  const area = document.getElementById('erro-area');
  if(area){
    area.innerHTML = `<div class="reset-warning"><strong>Erro detectado:</strong><br>${e.message}<br><small>Arquivo: ${e.filename}, linha ${e.lineno}</small><br><button onclick="resetarTudo()">Resetar Tudo</button></div>`;
  } else {
    // DOM ainda não pronto - cria um div básico
    document.body.insertAdjacentHTML('afterbegin', `<div style="background:#fee;border:2px solid #c00;color:#900;padding:12px;margin:10px;font-family:monospace;font-size:13px"><strong>Erro:</strong> ${e.message}<br>linha ${e.lineno}<br><button onclick="localStorage.clear();location.reload()" style="margin-top:8px;padding:6px 12px;background:#900;color:#fff;border:none;border-radius:4px">Limpar tudo e recarregar</button></div>`);
  }
});
window.addEventListener('unhandledrejection', function(e){
  const area = document.getElementById('erro-area');
  if(area) area.innerHTML = `<div class="reset-warning"><strong>Erro (promise):</strong> ${e.reason}<br><button onclick="resetarTudo()">Resetar Tudo</button></div>`;
});

// ===================== STORAGE (com tratamento de erro robusto) =====================
// Detecta se localStorage funciona
let storageDisponivel = false;
try {
  localStorage.setItem('__test__', '1');
  localStorage.removeItem('__test__');
  storageDisponivel = true;
} catch(e) {
  storageDisponivel = false;
  console.warn('localStorage não disponível - rodando em modo memória');
}

function carregarTudo(){
  try {
    // CARREGAR ALIMENTOS
    let alimentosOk = false;
    if(storageDisponivel){
      try{
        const a = localStorage.getItem('alimentos_v2');
        if(a){
          const parsed = JSON.parse(a);
          if(Array.isArray(parsed) && parsed.length > 0){
            alimentos = parsed.filter(al => al && typeof al.n === 'string' && typeof al.kcal === 'number').map(al => ({
              n: al.n,
              kcal: Number(al.kcal) || 0,
              carb: Number(al.carb) || 0,
              prot: Number(al.prot) || 0,
              gord: Number(al.gord) || 0,
              fibra: Number(al.fibra) || 0,
              tipo: al.tipo === 'unidade' ? 'unidade' : 'peso',
              ...(al.tipo === 'unidade' ? { tamanho: Number(al.tamanho) || 100, medida: al.medida || 'g' } : {})
            }));
            if(alimentos.length > 0) alimentosOk = true;
          }
        }
      }catch(e){ console.error('Erro ao carregar alimentos:', e); alimentos = []; }
    }

    if(!alimentosOk){
      alimentos = JSON.parse(JSON.stringify(ALIMENTOS_PADRAO));
      salvarAlimentosStorage(); // tenta salvar mas se falhar não importa
    } else {
      const nomesExistentes = new Set(alimentos.map(a => a.n.toLowerCase().trim()));
      const novos = ALIMENTOS_PADRAO.filter(a => !nomesExistentes.has(a.n.toLowerCase().trim()));
      if(novos.length > 0){
        alimentos = alimentos.concat(novos);
        salvarAlimentosStorage();
      }
    }

    // CARREGAR METAS
    if(storageDisponivel){
      try{
        const m = localStorage.getItem('metas');
        if(m){
          const parsed = JSON.parse(m);
          if(parsed && parsed.kcal && parsed.carb && parsed.prot && parsed.gord){
            if(!parsed.fibra || !Array.isArray(parsed.fibra)) parsed.fibra = [25, 35];
            metas = parsed;
          }
        }
      }catch(e){ console.error('Erro ao carregar metas:', e); }
    }

    // CARREGAR DIÁRIO
    if(storageDisponivel){
      try{
        const d = localStorage.getItem('diario');
        if(d){
          const parsed = JSON.parse(d);
          if(Array.isArray(parsed) && parsed.length === 4){
            diario = parsed.map(ref => Array.isArray(ref) ? ref.filter(it => it && it.alim).map(it => ({
              qtd: Number(it.qtd) || 0,
              alim: {
                n: it.alim.n || '?',
                kcal: Number(it.alim.kcal) || 0,
                carb: Number(it.alim.carb) || 0,
                prot: Number(it.alim.prot) || 0,
                gord: Number(it.alim.gord) || 0,
                fibra: Number(it.alim.fibra) || 0,
                tipo: it.alim.tipo === 'unidade' ? 'unidade' : 'peso',
                ...(it.alim.tipo === 'unidade' ? { tamanho: Number(it.alim.tamanho) || 100, medida: it.alim.medida || 'g' } : {})
              }
            })) : []);
          }
        }
      }catch(e){ console.error('Erro ao carregar diário:', e); diario = [[],[],[],[]]; }
    }

    renderTudo();

    // Avisa o usuário se storage estiver indisponível (depois de renderizar)
    if(!storageDisponivel){
      document.getElementById('erro-area').innerHTML = '<div class="reset-warning">⚠️ O armazenamento do navegador está bloqueado. A ferramenta funciona, mas os dados não serão salvos ao recarregar a página. Verifique se está em modo anônimo ou se cookies estão bloqueados.</div>';
    }
  } catch(e){
    console.error('Erro fatal em carregarTudo:', e);
    // Último recurso: ainda assim tenta renderizar com dados padrão
    try {
      alimentos = JSON.parse(JSON.stringify(ALIMENTOS_PADRAO));
      diario = [[],[],[],[]];
      renderTudo();
    } catch(e2) {
      document.body.insertAdjacentHTML('afterbegin', `<div style="background:#fee;border:2px solid #c00;color:#900;padding:12px;margin:10px;font-family:monospace;font-size:13px"><strong>Erro:</strong> ${e.message}</div>`);
    }
  }
}

function salvarAlimentosStorage(){ if(!storageDisponivel) return; try{ localStorage.setItem('alimentos_v2', JSON.stringify(alimentos)); }catch(e){ storageDisponivel = false; console.warn('Storage falhou, modo memória ativado'); } }
function salvarDiarioStorage(){ if(!storageDisponivel) return; try{ localStorage.setItem('diario', JSON.stringify(diario)); }catch(e){ storageDisponivel = false; console.warn('Storage falhou'); } }
function salvarMetasStorage(){ if(!storageDisponivel) return; try{ localStorage.setItem('metas', JSON.stringify(metas)); }catch(e){ storageDisponivel = false; console.warn('Storage falhou'); } }

function mostrarErro(msg){
  document.getElementById('erro-area').innerHTML = `<div class="reset-warning">${msg}. Se o problema persistir, clique em "Resetar Tudo" na aba Metas.</div>`;
  setTimeout(()=>{ document.getElementById('erro-area').innerHTML = ''; }, 5000);
}

function resetarTudo(){
  if(!confirm('Isso vai APAGAR todos os alimentos cadastrados, refeições do dia e metas. Tem certeza?')) return;
  localStorage.removeItem('alimentos_v2');
  localStorage.removeItem('diario');
  localStorage.removeItem('metas');
  location.reload();
}

// ===================== HELPERS =====================
function statusClass(v, faixa){ if(v < faixa[0]) return 'low'; if(v > faixa[1]) return 'high'; return 'ok'; }

function calcMacros(alim, qtd){
  const fibra = typeof alim.fibra === 'number' ? alim.fibra : 0;
  if(alim.tipo === 'unidade'){
    return { kcal: alim.kcal * qtd, carb: alim.carb * qtd, prot: alim.prot * qtd, gord: alim.gord * qtd, fibra: fibra * qtd };
  }
  const f = qtd / 100;
  return { kcal: alim.kcal * f, carb: alim.carb * f, prot: alim.prot * f, gord: alim.gord * f, fibra: fibra * f };
}

function descricaoQtd(it){
  if(it.alim.tipo === 'unidade'){
    const total = (it.alim.tamanho * it.qtd).toFixed(0);
    const medida = it.alim.medida || 'g';
    if(it.qtd === 1) return `1 unidade (${total}${medida})`;
    return `${it.qtd}× ${it.alim.tamanho}${medida} (${total}${medida})`;
  }
  return `${it.qtd}g`;
}

// ===================== RENDER =====================
function renderTudo(){
  try{
    renderResumo();
    renderRefeicoes();
    renderListaAlim();
    renderMetasForm();
  }catch(e){
    console.error('Erro ao renderizar:', e);
    mostrarErro('Erro ao carregar dados: ' + e.message);
  }
}

function renderResumo(){
  let tk=0,tc=0,tp=0,tg=0,tf=0;
  diario.forEach(ref => ref.forEach(it => {
    const m = calcMacros(it.alim, it.qtd);
    tk+=m.kcal; tc+=m.carb; tp+=m.prot; tg+=m.gord; tf+=m.fibra;
  }));
  document.getElementById('resumo').innerHTML = `
    <div class="r-card"><span class="r-label">Calorias</span><div class="r-value ${statusClass(tk,metas.kcal)}">${tk.toFixed(0)}<span class="r-meta">alvo ${metas.kcal[0]}–${metas.kcal[1]}</span></div></div>
    <div class="r-card"><span class="r-label">Carboidrato</span><div class="r-value ${statusClass(tc,metas.carb)}">${tc.toFixed(1)}g<span class="r-meta">alvo ${metas.carb[0]}–${metas.carb[1]}</span></div></div>
    <div class="r-card"><span class="r-label">Proteína</span><div class="r-value ${statusClass(tp,metas.prot)}">${tp.toFixed(1)}g<span class="r-meta">alvo ${metas.prot[0]}–${metas.prot[1]}</span></div></div>
    <div class="r-card"><span class="r-label">Gordura</span><div class="r-value ${statusClass(tg,metas.gord)}">${tg.toFixed(1)}g<span class="r-meta">alvo ${metas.gord[0]}–${metas.gord[1]}</span></div></div>
    <div class="r-card" style="grid-column:span 2"><span class="r-label">Fibra</span><div class="r-value ${statusClass(tf,metas.fibra)}">${tf.toFixed(1)}g<span class="r-meta">alvo ${metas.fibra[0]}–${metas.fibra[1]}</span></div></div>`;
}

function renderRefeicoes(){
  const cont = document.getElementById('refeicoes');
  cont.innerHTML = '';
  NOMES_REF.forEach((nome, rIdx) => {
    let rk=0,rc=0,rp=0,rg=0,rf=0;
    const itemsHtml = diario[rIdx].map((it, iIdx) => {
      const m = calcMacros(it.alim, it.qtd);
      rk+=m.kcal; rc+=m.carb; rp+=m.prot; rg+=m.gord; rf+=m.fibra;
      return `<div class="item"><span class="item-name">${it.alim.n} <span class="item-peso">· ${descricaoQtd(it)} · ${m.kcal.toFixed(0)} kcal</span></span><div class="tags"><span class="tag">C ${m.carb.toFixed(1)}g</span><span class="tag">P ${m.prot.toFixed(1)}g</span><span class="tag">G ${m.gord.toFixed(1)}g</span><span class="tag">F ${m.fibra.toFixed(1)}g</span></div><button class="btn-del no-print" onclick="removerItem(${rIdx},${iIdx})">✕</button></div>`;
    }).join('');

    const opts = alimentos.map((a,i)=>({a,i})).sort((x,y)=>x.a.n.localeCompare(y.a.n,'pt')).map(({a,i})=>`<option value="${i}">${a.n}${a.tipo==='unidade'?` (${a.tamanho}${a.medida||'g'})`:''}</option>`).join('');

    cont.innerHTML += `
      <div class="ref-card">
        <div class="ref-head"><h2 class="ref-title">${nome}</h2><div class="macros-row"><span>${rk.toFixed(0)} kcal</span><span>C ${rc.toFixed(1)}g</span><span>P ${rp.toFixed(1)}g</span><span>G ${rg.toFixed(1)}g</span><span>F ${rf.toFixed(1)}g</span></div></div>
        ${itemsHtml || '<div class="empty">Sem itens</div>'}
        <div class="add-area no-print">
          <select id="sel-${rIdx}" onchange="atualizarPlaceholder(${rIdx})"><option value="-1">+ alimento...</option>${opts}</select>
          <input type="number" id="qtd-${rIdx}" placeholder="peso g" min="0" step="0.1">
          <button class="btn-add" onclick="adicionarItem(${rIdx})">+</button>
        </div>
      </div>`;
  });
}

function atualizarPlaceholder(rIdx){
  const sel = document.getElementById(`sel-${rIdx}`);
  const input = document.getElementById(`qtd-${rIdx}`);
  const idx = parseInt(sel.value);
  if(idx < 0){ input.placeholder = 'peso g'; return; }
  const alim = alimentos[idx];
  if(alim.tipo === 'unidade'){
    input.placeholder = `unid. (${alim.tamanho}${alim.medida||'g'})`;
    input.value = '1';
  } else {
    input.placeholder = 'peso g';
    input.value = '';
  }
}

function renderListaAlim(){
  const cont = document.getElementById('lista-alim');
  if(alimentos.length === 0){ cont.innerHTML = '<div class="empty">Nenhum alimento cadastrado</div>'; return; }
  const porPeso = alimentos.map((a,i)=>({a,i})).filter(x=>x.a.tipo!=='unidade').sort((x,y)=>x.a.n.localeCompare(y.a.n,'pt'));
  const porUnidade = alimentos.map((a,i)=>({a,i})).filter(x=>x.a.tipo==='unidade').sort((x,y)=>x.a.n.localeCompare(y.a.n,'pt'));
  let html = '';
  if(porPeso.length){
    html += '<div class="lista-categoria">Por 100g</div>';
    html += porPeso.map(({a,i})=>`<div class="alim-row"><div class="alim-info"><strong>${a.n}</strong><small>${a.kcal} kcal · C ${a.carb}g · P ${a.prot}g · G ${a.gord}g · F ${a.fibra||0}g / 100g</small></div><button class="edit-btn" onclick="editarAlimento(${i})">editar</button><button class="del-btn" onclick="excluirAlimento(${i})">excluir</button></div>`).join('');
  }
  if(porUnidade.length){
    html += '<div class="lista-categoria">Por Unidade</div>';
    html += porUnidade.map(({a,i})=>`<div class="alim-row"><div class="alim-info"><strong>${a.n} <span class="badge">${a.tamanho}${a.medida||'g'}</span></strong><small>${a.kcal} kcal · C ${a.carb}g · P ${a.prot}g · G ${a.gord}g · F ${a.fibra||0}g por unidade</small></div><button class="edit-btn" onclick="editarAlimento(${i})">editar</button><button class="del-btn" onclick="excluirAlimento(${i})">excluir</button></div>`).join('');
  }
  cont.innerHTML = html;
}

function renderMetasForm(){
  document.getElementById('meta-kcal-min').value = metas.kcal[0];
  document.getElementById('meta-kcal-max').value = metas.kcal[1];
  document.getElementById('meta-carb-min').value = metas.carb[0];
  document.getElementById('meta-carb-max').value = metas.carb[1];
  document.getElementById('meta-prot-min').value = metas.prot[0];
  document.getElementById('meta-prot-max').value = metas.prot[1];
  document.getElementById('meta-gord-min').value = metas.gord[0];
  document.getElementById('meta-gord-max').value = metas.gord[1];
  document.getElementById('meta-fibra-min').value = metas.fibra[0];
  document.getElementById('meta-fibra-max').value = metas.fibra[1];
}

function toggleTipo(tipo){
  document.getElementById('cad-tipo').value = tipo;
  document.querySelectorAll('.tipo-btn').forEach(b => b.classList.toggle('active', b.dataset.tipo === tipo));
  const unidadeBlock = document.getElementById('unidade-fields-block');
  const labelBase = document.getElementById('label-base');
  if(tipo === 'unidade'){
    unidadeBlock.classList.add('active');
    labelBase.textContent = 'Valores por UNIDADE (toda a porção)';
  } else {
    unidadeBlock.classList.remove('active');
    labelBase.textContent = 'Valores por 100g';
  }
}

function adicionarItem(rIdx){
  const sel = document.getElementById(`sel-${rIdx}`);
  const qtd = parseFloat(document.getElementById(`qtd-${rIdx}`).value);
  const idx = parseInt(sel.value);
  if(idx < 0 || isNaN(qtd) || qtd <= 0){
    const alim = idx >= 0 ? alimentos[idx] : null;
    if(alim && alim.tipo === 'unidade') alert('Selecione um alimento e informe quantas unidades');
    else alert('Selecione um alimento e informe o peso em gramas');
    return;
  }
  diario[rIdx].push({ alim: alimentos[idx], qtd: qtd });
  salvarDiarioStorage();
  renderResumo(); renderRefeicoes();
}

function removerItem(rIdx, iIdx){
  diario[rIdx].splice(iIdx,1);
  salvarDiarioStorage();
  renderResumo(); renderRefeicoes();
}

function salvarAlimento(){
  const nome = document.getElementById('cad-nome').value.trim();
  const kcal = parseFloat(document.getElementById('cad-kcal').value);
  const carb = parseFloat(document.getElementById('cad-carb').value);
  const prot = parseFloat(document.getElementById('cad-prot').value);
  const gord = parseFloat(document.getElementById('cad-gord').value);
  const fibraVal = parseFloat(document.getElementById('cad-fibra').value);
  const fibra = isNaN(fibraVal) ? 0 : fibraVal;
  const tipo = document.getElementById('cad-tipo').value;
  if(!nome || isNaN(kcal) || isNaN(carb) || isNaN(prot) || isNaN(gord)){ alert('Preencha calorias, carboidrato, proteína e gordura'); return; }
  const novoAlim = { n:nome, kcal, carb, prot, gord, fibra, tipo };
  if(tipo === 'unidade'){
    const tamanho = parseFloat(document.getElementById('cad-tamanho').value);
    const medida = document.getElementById('cad-medida').value;
    if(isNaN(tamanho) || tamanho <= 0){ alert('Informe o tamanho da unidade'); return; }
    novoAlim.tamanho = tamanho;
    novoAlim.medida = medida;
  }
  const editing = document.getElementById('cad-editing').value;
  if(editing !== '') alimentos[parseInt(editing)] = novoAlim;
  else alimentos.push(novoAlim);
  salvarAlimentosStorage();
  limparFormCad();
  renderTudo();
}

function editarAlimento(i){
  const a = alimentos[i];
  document.getElementById('cad-nome').value = a.n;
  document.getElementById('cad-kcal').value = a.kcal;
  document.getElementById('cad-carb').value = a.carb;
  document.getElementById('cad-prot').value = a.prot;
  document.getElementById('cad-gord').value = a.gord;
  document.getElementById('cad-fibra').value = a.fibra || 0;
  document.getElementById('cad-editing').value = i;
  toggleTipo(a.tipo || 'peso');
  if(a.tipo === 'unidade'){
    document.getElementById('cad-tamanho').value = a.tamanho;
    document.getElementById('cad-medida').value = a.medida || 'g';
  }
  document.getElementById('btn-cancelar').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}

function cancelarEdicao(){ limparFormCad(); }

function excluirAlimento(i){
  if(!confirm(`Excluir "${alimentos[i].n}"?`)) return;
  alimentos.splice(i,1);
  salvarAlimentosStorage();
  renderTudo();
}

function limparFormCad(){
  ['cad-nome','cad-kcal','cad-carb','cad-prot','cad-gord','cad-fibra','cad-tamanho'].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
  document.getElementById('cad-editing').value = '';
  document.getElementById('btn-cancelar').style.display = 'none';
  toggleTipo('peso');
}

function salvarMetas(){
  metas = {
    kcal:[parseFloat(document.getElementById('meta-kcal-min').value), parseFloat(document.getElementById('meta-kcal-max').value)],
    carb:[parseFloat(document.getElementById('meta-carb-min').value), parseFloat(document.getElementById('meta-carb-max').value)],
    prot:[parseFloat(document.getElementById('meta-prot-min').value), parseFloat(document.getElementById('meta-prot-max').value)],
    gord:[parseFloat(document.getElementById('meta-gord-min').value), parseFloat(document.getElementById('meta-gord-max').value)],
    fibra:[parseFloat(document.getElementById('meta-fibra-min').value), parseFloat(document.getElementById('meta-fibra-max').value)]
  };
  salvarMetasStorage();
  renderResumo();
  alert('Metas atualizadas');
}

function limparDia(){
  if(!confirm('Limpar todos os itens do dia?')) return;
  diario = [[],[],[],[]];
  salvarDiarioStorage();
  renderResumo(); renderRefeicoes();
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
    document.getElementById('tab-' + t.dataset.tab).classList.remove('hidden');
  });
});

// Init: aguarda DOM
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', carregarTudo);
} else {
  carregarTudo();
}
</script>
</body>
</html>
